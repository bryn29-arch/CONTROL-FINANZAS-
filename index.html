<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ingresos y Gastos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800 pb-20">

  <!-- Encabezado Superior -->
  <header class="bg-[#0288D1] text-white px-4 py-3 flex items-center justify-between shadow-md sticky top-0 z-30">
    <div class="flex items-center space-x-3">
      <button class="text-xl focus:outline-none"><i class="fa-solid fa-bars"></i></button>
      <h1 class="text-lg font-semibold flex items-center gap-1 cursor-pointer">
        Ingresos Gastos <i class="fa-solid fa-chevron-down text-xs"></i>
      </h1>
    </div>
    <div class="flex items-center space-x-4">
      <div class="relative cursor-pointer">
        <i class="fa-solid fa-bell text-xl"></i>
        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">1</span>
      </div>
      <button class="text-xl focus:outline-none"><i class="fa-solid fa-list-check"></i></button>
    </div>
  </header>

  <!-- Pestañas de navegación -->
  <nav class="bg-white border-b border-gray-200 flex text-center font-semibold text-xs tracking-wide">
    <div class="flex-1 py-3 text-[#0288D1] border-b-2 border-[#0288D1]">CASA</div>
    <div class="flex-1 py-3 text-gray-400">CALENDARIO</div>
    <div class="flex-1 py-3 text-gray-400">CUADERNO</div>
  </nav>

  <!-- Contenedor Principal -->
  <main class="max-w-md mx-auto p-3 space-y-3">

    <!-- 4 Botones de Acción -->
    <div class="grid grid-cols-2 gap-2">
      <!-- Añadir Ingresos -->
      <button onclick="abrirModal('INCOME')" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex flex-col items-center justify-center active:bg-gray-50">
        <div class="w-8 h-8 rounded-full border-2 border-emerald-500 flex items-center justify-center text-emerald-500 mb-1">
          <i class="fa-solid fa-plus text-sm"></i>
        </div>
        <span class="text-xs font-semibold text-gray-700">Añadir Ingresos</span>
      </button>

      <!-- Añadir Gastos -->
      <button onclick="abrirModal('EXPENSE')" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex flex-col items-center justify-center active:bg-gray-50">
        <div class="w-8 h-8 rounded-full border-2 border-rose-500 flex items-center justify-center text-rose-500 mb-1">
          <i class="fa-solid fa-minus text-sm"></i>
        </div>
        <span class="text-xs font-semibold text-gray-700">Añadir Gastos</span>
      </button>

      <!-- Transferir -->
      <button class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex flex-col items-center justify-center active:bg-gray-50">
        <div class="text-amber-500 text-lg mb-1">
          <i class="fa-solid fa-right-left"></i>
        </div>
        <span class="text-xs font-semibold text-gray-700">Transferir</span>
      </button>

      <!-- Transacciones -->
      <button onclick="cargarDatos()" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex flex-col items-center justify-center active:bg-gray-50">
        <div class="text-sky-500 text-lg mb-1">
          <i class="fa-solid fa-list-ul"></i>
        </div>
        <span class="text-xs font-semibold text-gray-700">Refrescar</span>
      </button>
    </div>

    <!-- Barra de Rango de Fecha -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-2">
      <div class="flex items-center justify-between text-xs font-bold text-gray-700 border-b border-gray-100 pb-2">
        <button class="text-gray-400 px-2 py-1"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="mes-activo">Mes Actual</span>
        <button class="text-gray-400 px-2 py-1"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <!-- Métricas Resumen -->
      <div class="grid grid-cols-3 text-center py-2 border-b border-gray-100">
        <div>
          <span class="text-[11px] text-gray-400 block font-medium">Ingresos</span>
          <span id="total-ingresos" class="text-sm font-bold text-emerald-600">$0</span>
        </div>
        <div>
          <span class="text-[11px] text-gray-400 block font-medium">Gastos</span>
          <span id="total-gastos" class="text-sm font-bold text-rose-600">$0</span>
        </div>
        <div>
          <span class="text-[11px] text-gray-400 block font-medium">Saldo</span>
          <span id="saldo-mes" class="text-sm font-bold text-gray-800">$0</span>
        </div>
      </div>

      <!-- Saldo Total / Presupuesto -->
      <div class="pt-2 px-3 text-xs space-y-1 font-semibold">
        <div class="flex justify-between text-gray-500">
          <span>Presupuesto Fijo</span>
          <span id="presupuesto-fijo">$1.000.000</span>
        </div>
        <div class="flex justify-between text-gray-800">
          <span>Saldo Disponible</span>
          <span id="saldo-disponible" class="text-emerald-600 font-bold">$0</span>
        </div>
      </div>
    </div>

    <!-- Lista de Transacciones Recientes -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-4 py-2.5 border-b border-gray-100">
        <h2 class="text-xs font-bold text-gray-800">Transacciones Recientes</h2>
      </div>

      <div id="lista-transacciones" class="divide-y divide-gray-100 text-xs">
        <div class="p-6 text-center text-gray-400">Cargando transacciones...</div>
      </div>
    </div>
  </main>

  <!-- Botón Flotante Agregar (+) -->
  <button onclick="abrirModal('EXPENSE')" class="fixed bottom-6 right-6 w-14 h-14 bg-[#0288D1] text-white rounded-full shadow-lg flex items-center justify-center text-2xl active:scale-95 transition-transform z-20">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- Modal para Agregar Ingreso / Gasto -->
  <div id="modal-form" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 id="modal-titulo" class="font-bold text-base text-gray-800">Añadir Gasto</h3>
        <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="transaccion-form" onsubmit="guardarTransaccion(event)" class="space-y-3">
        <input type="hidden" id="form-type" value="EXPENSE">
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Monto ($)</label>
          <input type="number" step="any" id="form-amount" required placeholder="Ej: 15000" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#0288D1] outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Descripción / Comercio</label>
          <input type="text" id="form-desc" required placeholder="Ej: Supermercado, Alquiler" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#0288D1] outline-none">
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-[#0288D1] text-white font-bold py-3 rounded-lg text-sm shadow active:bg-sky-700">
          Guardar Registro
        </button>
      </form>
    </div>
  </div>

  <!-- Lógica y Conexión Supabase -->
  <script>
    const SUPABASE_URL = "https://wbldallqswghurskfket.supabase.co";
    // Tu anon key
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndibGRhbGxxc3dnaHVyc2trZmtldCIsInJvbGUiOiJhbG9uIiwiaWF0IjoxNzYwNzE2MTEzLCJleHAiOjIwNzYyOTIxMTN9.vT56d_U2O_B1Zg8FfS3fDqJ8O7V8HqN8bO5F2QxJ7Yk";

    const headers = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json"
    };

    function formatoDinero(num) {
      return "$" + Number(num).toLocaleString('es-CL', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function formatearFecha(isoString) {
      const fecha = new Date(isoString);
      const opciones = { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' };
      return fecha.toLocaleDateString('es-ES', opciones);
    }

    // Cargar datos consolidados y transacciones
    async function cargarDatos() {
      try {
        // 1. Cargar métricas de monthly_status
        const resStatus = await fetch(`${SUPABASE_URL}/rest/v1/monthly_status?select=*`, { headers });
        const dataStatus = await resStatus.json();
        
        if (dataStatus && dataStatus.length > 0) {
          const s = dataStatus[0];
          document.getElementById('total-ingresos').innerText = formatoDinero(s.total_income || 0);
          document.getElementById('total-gastos').innerText = formatoDinero(s.total_spent || 0);
          document.getElementById('saldo-mes').innerText = formatoDinero((s.total_income || 0) - (s.total_spent || 0));
          document.getElementById('presupuesto-fijo').innerText = formatoDinero(s.monthly_budget || 1000000);
          document.getElementById('saldo-disponible').innerText = formatoDinero(s.remaining_budget);
        }

        // 2. Cargar lista de transacciones recientes
        const resTx = await fetch(`${SUPABASE_URL}/rest/v1/transactions?select=*&order=created_at.desc&limit=20`, { headers });
        const transacciones = await resTx.json();

        const lista = document.getElementById('lista-transacciones');
        if (!transacciones || transacciones.length === 0) {
          lista.innerHTML = `<div class="p-6 text-center text-gray-400">No hay movimientos registrados aún.</div>`;
          return;
        }

        lista.innerHTML = transacciones.map(tx => {
          const esGasto = tx.type === 'EXPENSE';
          const colorMonto = esGasto ? 'text-rose-600' : 'text-emerald-600';
          const signo = esGasto ? '-' : '+';
          const metodo = tx.payment_method || (esGasto ? 'Tarjeta' : 'Transferencia');

          return `
            <div class="p-3.5 flex items-center justify-between hover:bg-gray-50 transition">
              <div>
                <div class="text-[11px] text-gray-400 font-medium">${formatearFecha(tx.created_at)}</div>
                <div class="font-bold text-gray-800 text-sm mt-0.5">${tx.description || 'Sin detalle'}</div>
                <div class="inline-block mt-1 bg-gray-100 text-gray-500 text-[10px] px-2 py-0.5 rounded font-medium border border-gray-200">
                  ${metodo}
                </div>
              </div>
              <div class="text-right">
                <span class="text-sm font-bold ${colorMonto}">${signo} ${formatoDinero(tx.amount)}</span>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Error al cargar datos:", err);
      }
    }

    // Manejo de Modales
    function abrirModal(tipo) {
      document.getElementById('form-type').value = tipo;
      document.getElementById('modal-titulo').innerText = tipo === 'INCOME' ? 'Añadir Ingreso' : 'Añadir Gasto';
      document.getElementById('form-amount').value = '';
      document.getElementById('form-desc').value = '';
      document.getElementById('modal-form').classList.remove('hidden');
    }

    function cerrarModal() {
      document.getElementById('modal-form').classList.add('hidden');
    }

    // Guardar movimiento directo en Supabase
    async function guardarTransaccion(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const type = document.getElementById('form-type').value;
      const amount = parseFloat(document.getElementById('form-amount').value);
      const description = document.getElementById('form-desc').value;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/transactions`, {
          method: 'POST',
          headers,
          body: JSON.stringify({
            amount,
            description,
            type,
            payment_method: type === 'INCOME' ? 'Transferencia' : 'Efectivo'
          })
        });

        if (res.ok || res.status === 201) {
          cerrarModal();
          cargarDatos();
        } else {
          alert('Error al registrar el movimiento.');
        }
      } catch (err) {
        console.error(err);
        alert('Error de conexión.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Guardar Registro';
      }
    }

    // Cargar al iniciar
    document.addEventListener('DOMContentLoaded', cargarDatos);
  </script>
</body>
</html>
